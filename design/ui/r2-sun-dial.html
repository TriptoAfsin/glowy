<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2 Sun dial</title><link rel="stylesheet" href="base.css">
<style>
.light{background:radial-gradient(70% 80% at 30% 20%, oklch(93% 0.07 230), transparent 70%),radial-gradient(80% 80% at 80% 90%, oklch(92% 0.1 85), transparent 70%),oklch(96% 0.04 200)}
.corner{position:fixed;top:22px;left:22px;display:flex;gap:10px;align-items:center}
.corner .word{color:var(--navy-900)}
.tl{position:fixed;top:22px;right:22px;display:flex;gap:8px}
.chip{height:44px;min-width:44px;padding:0 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;color:var(--sky-50);white-space:nowrap;background:linear-gradient(180deg,var(--navy-800),var(--navy-900));box-shadow:0 10px 20px -10px oklch(20% 0.06 262 / .7),inset 0 1px 0 oklch(100% 0 0 / .15)}
.chip i{width:8px;height:8px;border-radius:50%;background:oklch(78% 0.15 152)}
.dock{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;padding:18px 28px;border-radius:999px;
  background:linear-gradient(180deg,var(--navy-800),var(--navy-900));box-shadow:0 30px 60px -24px oklch(20% 0.06 262 / .75),inset 0 2px 0 oklch(100% 0 0 / .12),inset 0 -3px 0 oklch(0% 0 0 / .3)}
.looks{display:flex;gap:14px}
.looks .orb{width:46px;height:46px}
.looks .on{outline:3px solid var(--sky-300);outline-offset:4px}
.dial{position:relative;flex:none;width:148px;height:148px;margin:-58px 0 -30px;border-radius:50%;
  background:conic-gradient(from 210deg,oklch(85% 0.08 235),oklch(97% 0.02 200),oklch(86% 0.12 85) 300deg,transparent 300deg);
  padding:12px;box-shadow:0 20px 34px -12px oklch(20% 0.06 262 / .7)}
.knob{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 28%,oklch(100% 0 0) 0 6%,oklch(96% 0.03 230) 35%,oklch(84% 0.08 240) 100%);
  box-shadow:inset 0 -6px 12px oklch(45% 0.12 255 / .35),inset 0 4px 6px oklch(100% 0 0 / .8),0 6px 0 oklch(62% 0.14 255)}
.knob b{display:block;font-size:26px;letter-spacing:-0.03em;color:var(--navy-900)}
.knob small{font:600 11px var(--mono);color:var(--sky-600)}
.pointer{position:absolute;top:10px;left:50%;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:var(--navy-900);transform-origin:3px 64px;transform:rotate(-24deg)}
.side{display:flex;flex-direction:column;gap:12px;width:200px}
.side .row{color:var(--sky-100)} .side .mono{color:var(--sky-300)}
.side .track{background:oklch(35% 0.06 262);box-shadow:inset 0 2px 3px oklch(0% 0 0 / .35)}
.side .track > i{background:linear-gradient(90deg,var(--sky-400),var(--sky-300))}
.side .track > b{box-shadow:0 4px 8px -2px oklch(0% 0 0 / .5),0 0 0 3px var(--sky-400)}
.shapes{display:flex;gap:6px}
.shapes span{flex:1;padding:8px 0;text-align:center;border-radius:999px;font-weight:700;font-size:12px;color:var(--sky-300);background:oklch(33% 0.06 262)}
.shapes span.on{color:var(--navy-900);background:linear-gradient(180deg,var(--sky-200),var(--sky-300));box-shadow:0 3px 0 var(--sky-500)}
.t-full{display:inline}
@media (max-width:760px){
  .corner{top:14px;left:14px} .corner .word{display:none}
  .tl{top:14px;right:14px;gap:6px} .t-full{display:none} .chip{padding:0 12px}
  .dock{left:10px;right:10px;bottom:10px;transform:none;flex-direction:column;gap:16px;padding:18px;border-radius:32px}
  .dial{margin:-70px 0 0}
  .side{width:100%}
}
</style></head><body>
<div class="light"></div>
<div class="corner"><img class="logo" src="../../src/assets/blue-sun.svg"><span class="word">glowy</span></div>
<div class="tl"><span class="chip"><i></i><span class="t-full">Stays awake</span></span><span class="chip">◉<span class="t-full"> Mirror</span></span><span class="chip">▶<span class="t-full"> Preview</span></span><span class="chip">⛶<span class="t-full"> Full screen</span></span></div>
<div class="dock">
  <div class="dial"><div class="knob"><div><b>5600 K</b><small>CLEAR SKY</small></div></div><span class="pointer"></span></div>
  <div class="looks">
    <span class="orb on" style="--c:oklch(97% 0.03 230);--d:oklch(80% 0.07 240)"></span>
    <span class="orb" style="--c:oklch(96% 0.02 95);--d:oklch(84% 0.05 85)"></span>
    <span class="orb" style="--c:oklch(90% 0.11 85);--d:oklch(74% 0.15 65)"></span>
    <span class="orb" style="--c:oklch(88% 0.07 45);--d:oklch(74% 0.1 35)"></span>
  </div>
  <div class="side">
    <div class="shapes"><span class="on">Fill</span><span>Halo</span><span>Edge</span></div>
    <div><div class="row"><span>Brightness</span><span class="mono">90%</span></div><div class="track"><i style="width:86%"></i><b style="left:86%"></b></div></div>
  </div>
</div>
</body></html>
