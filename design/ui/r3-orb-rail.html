<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R3 Orb rail</title><link rel="stylesheet" href="base.css">
<style>
.light{background:radial-gradient(circle closest-side at 46% 50%, oklch(17% 0.04 262) 0 52%, oklch(96% 0.04 230) 62% 90%, oklch(30% 0.05 262) 115%), oklch(20% 0.04 262)}
.corner{position:fixed;top:22px;left:22px;display:flex;gap:10px;align-items:center;padding:6px 18px 6px 6px;border-radius:999px}
.rail{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:92px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:16px;border-radius:46px}
.rail .orb{flex:none;width:56px;height:56px;position:relative}
.rail .on{outline:3px solid var(--sky-500);outline-offset:4px}
.tip{position:absolute;right:76px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:8px 14px;border-radius:14px;font-weight:700;font-size:13px;background:var(--paper);box-shadow:0 10px 20px -8px var(--shadow-sky)}
.tip small{display:block;font:500 11px var(--mono);color:var(--muted)}
.sep{flex:none;width:44px;border-top:1.5px dashed var(--sky-300)}
.shape{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--sky-100);box-shadow:inset 0 -2px 0 var(--lo)}
.shape.on{background:linear-gradient(180deg,var(--sky-300),var(--sky-400));box-shadow:0 4px 0 var(--sky-600),inset 0 2px 0 var(--hi)}
.shape i{width:26px;height:26px;border-radius:50%;border:5px solid var(--navy-800)}
.shape.on i{border-color:var(--paper)}
.vbar{position:fixed;right:132px;top:50%;transform:translateY(-50%);height:300px;width:64px;padding:16px 0;border-radius:32px;display:flex;flex-direction:column;align-items:center;gap:10px}
.vtrack{position:relative;flex:1;width:14px;border-radius:999px;background:var(--sky-200);box-shadow:inset 0 2px 3px var(--lo)}
.vtrack i{position:absolute;left:0;right:0;bottom:0;height:72%;border-radius:999px;background:linear-gradient(0deg,var(--sky-500),var(--sky-300))}
.vtrack b{position:absolute;left:50%;bottom:72%;width:28px;height:28px;margin:0 0 -14px -14px;border-radius:50%;background:linear-gradient(180deg,var(--paper),var(--sky-100));box-shadow:0 4px 8px -2px var(--shadow-sky),0 0 0 3px var(--sky-500)}
.bottom{position:fixed;left:22px;bottom:22px;display:flex;gap:10px}
.pill{height:48px;padding:0 18px;border-radius:999px;display:flex;align-items:center;font-weight:700;font-size:14px}
@media (max-width:760px){
  .corner{top:12px;left:12px;padding:6px} .corner .word{display:none}
  .bottom{top:12px;left:auto;right:12px;bottom:auto}
  .bottom .pill{display:none}
  .rail{top:auto;bottom:10px;left:10px;right:10px;transform:none;width:auto;height:84px;padding:0 16px;flex-direction:row;justify-content:flex-start;overflow:hidden;border-radius:42px}
  .tip{right:auto;left:50%;top:auto;bottom:74px;transform:translateX(-30%)}
  .sep{width:0;height:44px;border-top:0;border-left:1.5px dashed var(--sky-300)}
  .vbar{top:auto;right:10px;left:10px;bottom:104px;transform:none;width:auto;height:56px;padding:0 18px;flex-direction:row}
  .vtrack{height:14px;width:auto}
  .vtrack i{top:0;bottom:0;right:auto;height:auto;width:72%;background:linear-gradient(90deg,var(--sky-500),var(--sky-300))}
  .vtrack b{left:72%;bottom:50%;margin:0 0 -14px -14px}
}
</style></head><body>
<div class="light"></div>
<div class="corner clay"><img class="logo" src="../../src/assets/blue-sun.svg"><span class="word">glowy</span></div>
<div class="vbar clay"><span class="mono">72%</span><div class="vtrack"><i></i><b></b></div><span class="mono">☀</span></div>
<aside class="rail clay">
  <span class="orb on" style="--c:oklch(98% 0.015 230);--d:oklch(82% 0.06 240)"><span class="tip">Daylight<small>6500 K · Halo</small></span></span>
  <span class="orb" style="--c:oklch(90% 0.11 85);--d:oklch(74% 0.15 65)"></span>
  <span class="orb" style="--c:oklch(88% 0.07 45);--d:oklch(74% 0.1 35)"></span>
  <span class="orb" style="--c:oklch(89% 0.06 10);--d:oklch(76% 0.09 5)"></span>
  <span class="orb" style="--c:oklch(92% 0.05 290);--d:oklch(78% 0.08 285)"></span>
  <span class="sep"></span>
  <span class="shape"><i style="border-radius:8px;background:var(--navy-800);border:0"></i></span>
  <span class="shape on"><i></i></span>
  <span class="shape"><i style="border-radius:8px"></i></span>
</aside>
<div class="bottom"><span class="pill clay">Mirror</span><span class="push push--sky">Preview my call</span></div>
</body></html>
