<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1 Instrument</title><link rel="stylesheet" href="base.css">
<style>
/* Hallmark · genre: atmospheric · layout: bottom instrument strip · theme: Midnight (blue-sunshine tune) · nav: N9 edge-aligned · pre-emit critique: P4 H5 E4 S5 R5 V4 */
:root{
  --color-paper: oklch(15% 0.025 262);
  --color-paper-2: oklch(20% 0.03 262);
  --color-paper-3: oklch(25% 0.035 262);
  --color-ink: oklch(95% 0.01 240);
  --color-ink-2: oklch(72% 0.02 245);
  --color-ink-3: oklch(55% 0.025 250);
  --color-accent: oklch(80% 0.11 230);
  --color-accent-ink: oklch(18% 0.04 255);
  --color-warm: oklch(86% 0.12 80);
  --color-cool: oklch(90% 0.06 235);
  --color-live: oklch(78% 0.14 155);
  --color-shadow: oklch(8% 0.02 262 / 0.55);
  --light-sky: oklch(95% 0.035 230);
  --light-sun: oklch(97% 0.05 90);
  --light-edge: oklch(88% 0.06 235);
}
.stage{background:radial-gradient(60% 70% at 62% 30%, var(--light-sun), transparent 70%),radial-gradient(90% 80% at 20% 100%, var(--light-edge), transparent 70%),var(--light-sky)}
.corner{position:fixed;display:flex;align-items:center;gap:10px}
.tl{top:20px;left:20px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--color-paper);color:var(--color-ink);box-shadow:0 12px 30px -14px var(--color-shadow)}
.tl img{width:30px;height:30px}
.tl b{font:600 15px var(--font-display);letter-spacing:-0.02em}
.tl small{display:flex;align-items:center;gap:6px;font:500 12px var(--font-mono);color:var(--color-ink-3);margin-left:6px}
.tl small i{width:6px;height:6px;border-radius:50%;background:var(--color-live)}
.tr{top:20px;right:20px;padding:4px;border-radius:999px;background:var(--color-paper);color:var(--color-ink-2);box-shadow:0 12px 30px -14px var(--color-shadow)}
.tr span{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.tr span.on{background:var(--color-paper-3);color:var(--color-ink)}

.bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(980px,calc(100vw - 48px));display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:24px;background:var(--color-paper);color:var(--color-ink);box-shadow:0 30px 60px -28px var(--color-shadow)}
.zone{padding:14px 16px;border-radius:18px;background:var(--color-paper-2);min-width:0}
.zone h3{margin:0 0 12px;font:500 12px var(--font-mono);letter-spacing:0.04em;color:var(--color-ink-3)}
.looks{display:flex;gap:10px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px oklch(100% 0 0 / 0.12);flex:none}
.sw.on{box-shadow:0 0 0 2px var(--color-paper-2),0 0 0 3.5px var(--color-accent)}
.name{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;gap:8px;white-space:nowrap}
.name b{font:600 17px var(--font-display);letter-spacing:-0.02em}
.name span{font:400 12px var(--font-mono);color:var(--color-ink-2)}
.read{display:flex;align-items:baseline;gap:4px}
.read b{font:500 30px var(--font-mono);letter-spacing:-0.04em;line-height:1}
.read span{font:400 13px var(--font-mono);color:var(--color-ink-3)}
.track{position:relative;height:22px;margin-top:10px}
.track::before{content:'';position:absolute;inset:10px 0;border-radius:2px;background:var(--t,var(--color-paper-3))}
.ticks{position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(90deg,var(--color-ink-3) 0 1px,transparent 1px 10%);opacity:.5}
.thumb{position:absolute;top:4px;left:var(--x);width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--color-ink);box-shadow:0 0 0 3px var(--color-paper-2)}
.seg{display:flex;gap:2px;margin-top:12px;padding:2px;border-radius:10px;background:var(--color-paper)}
.seg span{flex:1;text-align:center;padding:6px 0;border-radius:8px;font:500 12px var(--font-body);color:var(--color-ink-3)}
.seg span.on{background:var(--color-paper-3);color:var(--color-ink)}
.go{display:flex;flex-direction:column;gap:8px;justify-content:center;padding:0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font:500 14px var(--font-body);white-space:nowrap}
.btn--p{background:var(--color-accent);color:var(--color-accent-ink)}
.btn--g{color:var(--color-ink-2);background:var(--color-paper-2)}
@media (max-width:1060px){ .looks{gap:7px} .sw{width:22px;height:22px} .zone{padding:12px 14px} }
@media (max-width:820px){
  .tl small{display:none}
  .bar{left:8px;right:8px;bottom:8px;transform:none;width:auto;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:22px}
  .zone:first-child{grid-column:1/-1}
  .go{grid-column:1/-1;flex-direction:row;padding:0}
  .go .btn{flex:1}
  .read b{font-size:24px}
}
@media (max-width:360px){ .tl b{display:none} .tl{padding:6px} .tr span{width:36px;height:36px} .looks{gap:7px} .sw{width:23px;height:23px} }
</style></head><body>
<div class="stage"></div>
<div class="corner tl"><img src="../../../src/assets/blue-sun.svg" alt=""><b>Glowy</b><small><i></i>awake</small></div>
<div class="corner tr">
  <span class="on" title="Mirror"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
  <span title="Full screen"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span>
  <span title="Hide"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/></svg></span>
</div>
<section class="bar">
  <div class="zone"><h3>LOOK</h3>
    <div class="looks">
      <span class="sw" style="--c:oklch(97% 0.01 240)"></span>
      <span class="sw on" style="--c:oklch(93% 0.05 230)"></span>
      <span class="sw" style="--c:oklch(95% 0.04 90)"></span>
      <span class="sw" style="--c:oklch(89% 0.1 80)"></span>
      <span class="sw" style="--c:oklch(88% 0.06 45)"></span>
      <span class="sw" style="--c:oklch(90% 0.05 10)"></span>
      <span class="sw" style="--c:oklch(92% 0.04 290)"></span>
    </div>
    <div class="name"><b>Clear sky</b><span>glow · fill</span></div>
  </div>
  <div class="zone"><h3>TEMPERATURE</h3>
    <div class="read"><b>5600</b><span>K</span></div>
    <div class="track" style="--t:linear-gradient(90deg,var(--color-warm),var(--color-cool));--x:66%"><span class="ticks"></span><span class="thumb"></span></div>
  </div>
  <div class="zone"><h3>OUTPUT</h3>
    <div class="read"><b>92</b><span>%</span></div>
    <div class="seg"><span class="on">Fill</span><span>Halo</span><span>Edge</span></div>
  </div>
  <div class="go"><span class="btn btn--p">Preview call</span><span class="btn btn--g">Save look</span></div>
</section>
</body></html>
