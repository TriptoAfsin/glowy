<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A3 Quiet HUD</title><link rel="stylesheet" href="base.css">
<style>
/* Hallmark · genre: atmospheric · layout: corner HUD + look carousel · theme: Aurora (blue-sunshine tune) · nav: N9 edge-aligned · pre-emit critique: P5 H4 E4 S4 R5 V5 */
:root{
  --color-paper: oklch(17% 0.03 258 / 0.94);
  --color-paper-2: oklch(24% 0.035 258);
  --color-ink: oklch(96% 0.01 235);
  --color-ink-2: oklch(76% 0.02 240);
  --color-ink-3: oklch(58% 0.03 250);
  --color-accent: oklch(82% 0.1 225);
  --color-on-light: oklch(22% 0.04 258);
  --color-on-light-2: oklch(40% 0.05 255);
  --color-shadow: oklch(10% 0.03 262 / 0.45);
  --light-a: oklch(91% 0.12 82);
  --light-b: oklch(94% 0.05 230);
  --light-c: oklch(97% 0.04 95);
}
.stage{background:radial-gradient(55% 65% at 28% 30%, var(--light-a), transparent 70%),radial-gradient(70% 70% at 85% 75%, var(--light-b), transparent 70%),var(--light-c)}
.tl{position:fixed;top:24px;left:28px;display:flex;align-items:center;gap:10px;color:var(--color-on-light)}
.tl img{width:28px;height:28px}
.tl b{font:600 15px var(--font-display);letter-spacing:-0.02em}
.tr{position:fixed;top:20px;right:20px;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--color-paper);color:var(--color-ink-2);box-shadow:0 16px 30px -16px var(--color-shadow)}
.tr span{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;font:500 13px var(--font-body);white-space:nowrap}
.tr span.on{background:var(--color-paper-2);color:var(--color-ink)}
.title{position:fixed;left:28px;bottom:28px;color:var(--color-on-light)}
.title h1{margin:0;font:600 clamp(36px,5vw,64px)/0.95 var(--font-display);letter-spacing:-0.045em;font-style:normal}
.title p{margin:12px 0 0;font:400 13px var(--font-mono);color:var(--color-on-light-2)}
.dock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--color-paper);box-shadow:0 24px 50px -20px var(--color-shadow)}
.dock .nav{width:40px;height:40px;display:grid;place-items:center;color:var(--color-ink-2);border-radius:50%}
.dock .sw{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px oklch(100% 0 0 / 0.14)}
.dock .sw.on{width:56px;height:40px;border-radius:999px;box-shadow:inset 0 0 0 1px oklch(100% 0 0 / 0.14),0 0 0 2px var(--color-paper),0 0 0 3.5px var(--color-accent)}
.right{position:fixed;right:28px;bottom:28px;display:flex;align-items:flex-end;gap:18px;color:var(--color-on-light)}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.meter b{font:500 40px/1 var(--font-mono);letter-spacing:-0.05em}
.meter b small{font-size:16px;color:var(--color-on-light-2)}
.bars{display:flex;gap:3px;align-items:flex-end;height:28px}
.bars i{width:4px;border-radius:2px;background:var(--color-on-light);opacity:.85}
.bars i.off{opacity:.18}
.shape{display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:16px;background:var(--color-paper)}
.shape span{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--color-ink-3)}
.shape span.on{background:var(--color-paper-2);color:var(--color-ink)}
.shape i{display:block;width:16px;height:16px;border:1.6px solid currentColor;border-radius:4px}
.shape i.h{border-radius:50%}
.shape i.e{box-shadow:inset 0 0 0 3px currentColor;border:0}
@media (max-width:820px){
  .tl{top:18px;left:18px} .tl b{display:none}
  .tr .lbl{display:none} .tr span{padding:0 11px}
  .title{left:18px;right:18px;bottom:auto;top:76px} .title h1{font-size:40px}
  .dock{left:8px;right:8px;bottom:8px;transform:none;justify-content:space-between;overflow:hidden}
  .dock .sw{width:34px;height:34px} .dock .sw.on{width:46px;height:34px}
  .dock .nav{display:none}
  .right{right:12px;left:12px;bottom:72px;justify-content:space-between;flex-direction:row-reverse}
  .shape{flex-direction:row}
  .meter b{font-size:32px}
}
@media (max-height:520px) and (min-width:821px){
  .title{bottom:auto;top:76px} .title h1{font-size:40px}
  .right{bottom:20px}
  .shape{flex-direction:row}
}
</style></head><body>
<div class="stage"></div>
<div class="tl"><img src="../../../src/assets/blue-sun.svg" alt=""><b>Glowy</b></div>
<div class="tr">
  <span class="on"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg><span class="lbl">Mirror</span></span>
  <span><svg class="i" viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg><span class="lbl">Preview</span></span>
  <span><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span>
</div>
<div class="title"><h1>Golden hour</h1><p>glow · drift calm · stays awake</p></div>
<div class="dock">
  <span class="nav"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></span>
  <span class="sw" style="--c:oklch(97% 0.01 240)"></span>
  <span class="sw" style="--c:oklch(93% 0.05 230)"></span>
  <span class="sw on" style="--c:oklch(89% 0.1 80)"></span>
  <span class="sw" style="--c:oklch(88% 0.06 45)"></span>
  <span class="sw" style="--c:oklch(90% 0.05 10)"></span>
  <span class="sw" style="--c:oklch(92% 0.04 290)"></span>
  <span class="nav"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
</div>
<div class="right">
  <div class="meter"><b>92<small>%</small></b><div class="bars"><i style="height:30%"></i><i style="height:40%"></i><i style="height:50%"></i><i style="height:60%"></i><i style="height:70%"></i><i style="height:80%"></i><i style="height:90%"></i><i class="off" style="height:100%"></i></div></div>
  <div class="shape"><span class="on"><i></i></span><span><i class="h"></i></span><span><i class="e"></i></span></div>
</div>
</body></html>
